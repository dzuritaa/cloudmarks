name: Publish experimental prerelease

# Publishing requires a deliberate version tag. Branch pushes never publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Require matching version, selected license and release notes
        run: |
          python -c 'import os,tomllib,pathlib; p=tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]; assert p.get("license") and pathlib.Path("LICENSE").is_file(), "Choose a license before release preparation"; assert os.environ["GITHUB_REF_NAME"] == "v"+p["version"]; assert pathlib.Path("docs/releases/"+os.environ["GITHUB_REF_NAME"]+".md").is_file()'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cloudmarks-distributions
          path: dist
      - run: python scripts/check_dist.py dist --release
      - name: Publish verified experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "CloudMarks $RELEASE_TAG (experimental)" --notes-file "docs/releases/$RELEASE_TAG.md" dist/*.whl dist/*.tar.gz dist/SHA256SUMS
